<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurko's Smart Expenditure Recorder</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="app">
    <header>
        <h1>💰 Aurko's Smart Expenditure Recorder</h1>
        <p class="subtitle">Log expenses, see where your money goes.</p>
    </header>

    <section class="summary-cards" id="summary-cards">
        <div class="card">
            <span class="card-label">Total Spent</span>
            <span class="card-value" id="grand-total">₹0.00</span>
        </div>
        <div class="card">
            <span class="card-label">Entries</span>
            <span class="card-value" id="entry-count">0</span>
        </div>
        <div class="card">
            <span class="card-label">Top Category</span>
            <span class="card-value" id="top-category">—</span>
        </div>
    </section>

    <main class="content">
        <section class="panel form-panel">
            <h2 id="form-title">Add Expense</h2>
            <form id="expense-form">
                <input type="hidden" id="expense-id">

                <label for="title">Title</label>
                <input type="text" id="title" placeholder="e.g. Groceries" required>

                <label for="amount">Amount (₹)</label>
                <input type="number" id="amount" step="0.01" min="0.01" placeholder="e.g. 450.00" required>

                <label for="category">Category</label>
                <select id="category" required>
                    <option value="">Select category</option>
                    <option>Food</option>
                    <option>Rent</option>
                    <option>Entertainment</option>
                    <option>Travel</option>
                    <option>Utilities</option>
                    <option>Health</option>
                    <option>Shopping</option>
                    <option>Other</option>
                </select>

                <label for="date">Date</label>
                <input type="date" id="date" required>

                <label for="notes">Notes (optional)</label>
                <textarea id="notes" rows="2" placeholder="Optional details"></textarea>

                <div class="form-actions">
                    <button type="submit" id="submit-btn">Add Expense</button>
                    <button type="button" id="cancel-edit-btn" class="secondary hidden">Cancel</button>
                </div>
                <p id="form-error" class="error hidden"></p>
            </form>
        </section>

        <section class="panel chart-panel">
            <h2>Spending by Category</h2>
            <canvas id="category-chart" height="220"></canvas>
            <p id="chart-empty" class="empty hidden">No expenses yet — add one to see the breakdown.</p>
        </section>
    </main>

    <section class="panel list-panel">
        <h2>Expense History</h2>
        <table id="expense-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Amount</th>
                    <th>Notes</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="expense-tbody"></tbody>
        </table>
        <p id="table-empty" class="empty hidden">No expenses logged yet.</p>
    </section>
</div>

<script src="app.js"></script>
</body>
</html>
